name: "CodeQL"

# Replaces CodeQL default setup, whose Go autobuilder runs with
# GOTOOLCHAIN=local and so cannot build a module requiring a newer Go than
# the CodeQL bundle ships. Advanced setup lets us pick the toolchain from
# go.mod, the same way the build and test workflows do.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # Keep the weekly cadence the default setup used.
    - cron: "24 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.language == 'go'
        env:
          GOTOOLCHAIN: auto
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
